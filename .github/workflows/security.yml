name: Security

# Runs on every pull request and weekly. The schedule matters as much as the PR
# trigger: a dependency that is safe today can have a CVE published against it
# tomorrow without a single line of this repository changing.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 06:00 UTC, so a new advisory is waiting at the start of the week.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --all-groups --frozen

      - name: Scan application code for insecure patterns
        run: uv run bandit -c pyproject.toml -r src scripts -f screen

      - name: Produce a machine-readable report
        if: always()
        run: uv run bandit -c pyproject.toml -r src scripts -f json -o bandit-report.json || true

      - name: Upload the bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: warn

  pip-audit:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv with dependency caching
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --all-groups --frozen

      - name: Audit the resolved dependency set
        # Audits the exported lockfile rather than the loose constraints in
        # pyproject, so the result describes what actually ships. --no-emit-project
        # excludes this package itself, which is not on PyPI.
        run: |
          mkdir -p reports
          uv export --format requirements-txt --no-emit-project --no-hashes --all-groups \
            -o reports/requirements.txt --quiet
          uv run pip-audit --strict --progress-spinner off --desc -r reports/requirements.txt

  gitleaks:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action calls the GitHub API on a pull_request event. The
    # workflow-wide grant is read-only, which makes that call return 403
    # ("Resource not accessible by integration"), so the access is granted to
    # this job alone rather than widening it for every job in the file.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@v4
        with:
          # A secret committed and later removed is still in the history, and is
          # still compromised. Scanning only the tip would miss it.
          fetch-depth: 0

      - name: Scan the repository and its history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-template:
    name: Environment template hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Confirm .env is not committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. It must be gitignored."
            exit 1
          fi
          echo ".env is not tracked."

      - name: Confirm .env.example carries no real secrets
        # Placeholder values must remain obviously fake. A real credential
        # pasted into the template is a leak that looks like documentation.
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r line; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            key="${line%%=*}"
            value="${line#*=}"
            case "$key" in
              # Names a header rather than holding a credential. API_KEY_HEADER
              # matches the *KEY* glob below, but "X-API-Key" is exactly the
              # value it should carry.
              *_HEADER|*_HEADERS) continue ;;
              *PASSWORD*|*SECRET*|*TOKEN*|*KEY*)
                case "$value" in
                  *change-me*|minioadmin|'') ;;
                  *)
                    echo "::error::$key in .env.example does not look like a placeholder."
                    status=1
                    ;;
                esac
                ;;
            esac
          done < .env.example
          exit "$status"
