# =============================================================================
# Production lines - sheet "Lineas Produccion" of the EQUS BATT workbook
#
# A hand-maintained catalogue, replaced whole on every load (a snapshot).
#
# Headers are written exactly as the workbook spells them, spaces included
# (note the two spaces in "Tiempo de configuración  (D H:M:S)"). Bronze keys
# each column by its header, so a header written differently here would be a
# different column. Silver reads Línea, Almac, Descripción and Planificación
# de Unidades por Hora; the other columns are kept in Bronze as delivered.
#
# docs/dataset-specs.md describes every field.
# =============================================================================
version: 1

key: lineas_produccion
kind: snapshot
label: datasets.lineas_produccion.name
description: datasets.lineas_produccion.description
entry_modes: [upload, grid, form]

bronze:
  source_key: manual_sheets
  sheet: Lineas Produccion
  dataset_key: lineas_produccion
  header_row: 1

silver:
  table: silver.lineas_produccion

natural_key: [Línea]

columns:
  - {header: Línea, type: text, required: true, pattern: "^[A-Z0-9]+$"}
  - {header: Almac, type: text, pattern: "^[0-9]{4}$"}
  - {header: Descripción, type: text}
  - {header: Planificación de Unidades por Hora, type: decimal, min: 0}
  - {header: Ubicación de Posdeducción, type: text}
  - {header: Método de cantidad de transacción, type: text}
  - {header: Programador, type: text}
  - {header: "Tiempo de configuración  (D H:M:S)", type: text, pattern: "^[0-9]+ [0-9]{1,2}:[0-9]{2}:[0-9]{2}$"}
  # Quoted: YAML reads an unquoted No as false.
  - {header: Firma Automática, type: text, allowed: ["Sí", "No"]}
  - {header: Última Firma Automática, type: text}
